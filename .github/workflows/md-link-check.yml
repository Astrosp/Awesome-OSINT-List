name: Check Markdown links

on:
  push:
    branches: [ main, dev, dev_3 ]
  pull_request:
    branches: [ main, dev, dev_3 ]

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        config-file: 'markdown-link-check-config.json'
        file-path: './README.md'
